<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStat Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard-container">
        <h1>OmniStat Dashboard</h1>
        <p>Welcome to your business dashboard!</p>

        <section class="dashboard-cards">
            <div class="card">
                <h2>Total Sales</h2>
                <p>$0.00</p>
            </div>

            <div class="card">
                <h2>Total Orders</h2>
                <p>0</p>
            </div>

            <div class="card">
                <h2>Inventory Items</h2>
                <p>0</p>
            </div>
        </section>
    </main>
</body>
</html>
