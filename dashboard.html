<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStat Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-page">
    <nav class="top-nav">
        <a href="dashboard.html" class="nav-brand">OmniStat</a>
        <div class="nav-links">
    <a href="dashboard.html" class="active">Overview</a>
    <a href="inventory.html">Inventory</a>
    <a href="reports.html">Reports</a>
    <a href="account.html">Account</a>
</div>
        <div class="nav-user">
            <div class="nav-user-text">
                <span id="userName"></span>
                <span id="businessName"></span>
            </div>
            <button id="logoutButton" type="button">Log Out</button>
        </div>
    </nav>
    <main class="dashboard-container">
        <h1>OmniStat Dashboard</h1>
        <p>Welcome to your business dashboard!</p>

        <section class="dashboard-cards">
            <div class="card">
                <h2>Total Sales</h2>
                <p>$0.00</p>
            </div>

            <div class="card">
                <h2>Total Orders</h2>
                <p>0</p>
            </div>

            <div class="card">
                <h2>Inventory Items</h2>
                <p>0</p>
            </div>
        </section>
        <!-- Nicholas - Task 2.7: revenue chart -->
        <section class="chart-section">
            <h2>Revenue, Last 30 Days</h2>
            <p class="sample-label">Sample data</p>
            <div class="chart-box">
                <canvas id="revenue-chart"></canvas>
            </div>
            </section>
<section class="upload-section">
    <h2>Upload Sales Data</h2>

    <div class="upload-box">
        <h3>Upload CSV File</h3>
        <p>Select a CSV file from your computer.</p>

        <input type="file" id="csvFile" accept=".csv,text/csv">

        <p id="fileMessage">No file selected</p>

        <button type="button" id="uploadButton">
            Upload File
        </button>
    </div>
</section>

    </main>
    <script>
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "signin.html";
    } else {
        fetch("/api/auth/me", {
            headers: {
                "Authorization": "Bearer " + token
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Unable to load user information");
            }
            return response.json();
        })
        .then(data => {
            document.getElementById("userName").textContent = data.name;
            document.getElementById("businessName").textContent = data.business_name;
        })
        .catch(error => {
            console.error(error);
        });
    }
</script>
        
<script>
    const csvFile = document.getElementById("csvFile");
    const fileMessage = document.getElementById("fileMessage");
    const uploadButton = document.getElementById("uploadButton");

    csvFile.addEventListener("change", function () {
        if (csvFile.files.length > 0) {
            const file = csvFile.files[0];

            if (!file.name.toLowerCase().endsWith(".csv")) {
                fileMessage.textContent = "Please choose a CSV file.";
                csvFile.value = "";
                return;
            }

            fileMessage.textContent = "Selected: " + file.name;
        } else {
            fileMessage.textContent = "No file selected";
        }
    });

    uploadButton.addEventListener("click", function () {
        if (csvFile.files.length === 0) {
            fileMessage.textContent = "Please select a CSV file first.";
            return;
        }

        fileMessage.textContent =
            "File selected. Backend upload is not connected yet.";
    });
</script>

<!-- Nicholas - Task 2.6: logout button -->
<script src="logout.js"></script>

<!-- Nicholas - Tasks 2.7 and 2.8: chart library + chart and KPI card code -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
